version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: goe_db
      POSTGRES_USER: goe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-goe_dev_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goe -d goe_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly no
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  neo4j:
    image: neo4j:5.15-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-goe_neo4j_2026}"
      NEO4J_PLUGINS: '["graph-data-science","apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "gds.*,apoc.*"
      NEO4J_server_memory_heap_max__size: "512m"
    volumes:
      - neo4j_data:/data
    ports:
      - "7475:7474"
      - "7688:7687"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 15s
      timeout: 10s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+asyncpg://goe:${POSTGRES_PASSWORD:-goe_dev_2026}@postgres:5432/goe_db"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-goe_neo4j_2026}"
      REDIS_URL: "redis://redis:6379"
      OLLAMA_URL: "${OLLAMA_URL:-http://host.docker.internal:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3.1:8b}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      CHROMADB_DIR: "/app/data/chromadb"
      ACLED_API_KEY: "${ACLED_API_KEY:-}"
      ACLED_EMAIL: "${ACLED_EMAIL:-}"
      NASA_FIRMS_KEY: "${NASA_FIRMS_KEY:-}"
      OPENSKY_USERNAME: "${OPENSKY_USERNAME:-}"
      OPENSKY_PASSWORD: "${OPENSKY_PASSWORD:-}"
      API_SECRET_KEY: "${API_SECRET_KEY:-dev-secret-change-in-prod}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:3000}"
      ENVIRONMENT: "${ENVIRONMENT:-development}"
    ports:
      - "8003:8000"
    volumes:
      - chromadb_data:/app/data/chromadb
      - model_cache:/app/models
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ws:
    build:
      context: ./apps/ws
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: "redis://redis:6379"
      WS_PORT: "8001"
      API_SECRET_KEY: "${API_SECRET_KEY:-dev-secret-change-in-prod}"
      AISSTREAM_API_KEY: "${AISSTREAM_API_KEY:-}"
    ports:
      - "8002:8001"

  mirofish:
    image: ghcr.io/666ghj/mirofish:latest
    ports:
      - "5001:5001"
    environment:
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-llama3.1:8b}
      ZEP_API_KEY: ${ZEP_API_KEY:-}
    depends_on:
      - redis
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  neo4j_data:
  chromadb_data:
  model_cache:
